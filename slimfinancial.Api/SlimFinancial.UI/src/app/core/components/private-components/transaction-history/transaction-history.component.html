  <table mat-table  [dataSource]="transactions()" [style.height]="'10rem'">
    @for(header of tableHeader; track header){
      <ng-container [matColumnDef]="header.columnDef">
        <th mat-header-cell *matHeaderCellDef class="has-background-link">
          {{header.header}}
        </th>
        <td mat-cell *matCellDef="let row">
        {{header.cell(row)}}
        </td>
      </ng-container>
    }
  
    <tr mat-header-row *matHeaderRowDef="tableHeaders"></tr>
    <tr mat-row *matRowDef="let row; columns: tableHeaders;"></tr>
  </table>
